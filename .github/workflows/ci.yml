name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage
      - run: npm run build -- --configuration production --base-href /games-room/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
