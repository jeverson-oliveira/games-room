<section class="settings">
  <header class="settings__header">
    <h2>⚙️ Configurações</h2>
    <p>Personalize sua experiência</p>
  </header>

  @if (saved()) {
    <div class="settings__toast" role="status">✓ Salvo!</div>
  }

  <div class="settings__card">
    <h3>Tema</h3>
    <div class="settings__row">
      <label>
        <input type="radio" name="theme" value="neon-dark" [checked]="theme() === 'neon-dark'" (change)="onThemeChange('neon-dark')" />
        Neon Dark (padrão)
      </label>
      <label>
        <input type="radio" name="theme" value="neon-light" [checked]="theme() === 'neon-light'" (change)="onThemeChange('neon-light')" />
        Neon Light
      </label>
    </div>
    <p class="settings__hint">Aplicado via <code>data-theme</code> no &lt;html&gt; e salvo em localStorage.</p>
  </div>

  <div class="settings__card">
    <h3>Filtros padrão</h3>
    <div class="settings__grid">
      <label>Plataforma padrão
        <select [ngModel]="defaultPlatform()" (ngModelChange)="onPlatformChange($event)">
          <option value="">Nenhum</option>
          @for (p of platforms.slice(1); track p) {
            <option [value]="p">{{ p }}</option>
          }
        </select>
      </label>
      <label>Gênero padrão
        <select [ngModel]="defaultGenre()" (ngModelChange)="onGenreChange($event)">
          <option value="">Nenhum</option>
          @for (g of genres.slice(1); track g) {
            <option [value]="g">{{ g }}</option>
          }
        </select>
      </label>
    </div>
    <p class="settings__hint">Usado para pré-preencher filtros em <strong>Jogos</strong> (próxima etapa: auto-aplicar).</p>
  </div>

  <div class="settings__card settings__card--danger">
    <h3>Dados locais</h3>
    <p>Limpa preferências salvas no navegador.</p>
    <button class="btn btn--danger" (click)="clearStorage()">Limpar configurações</button>
  </div>
</section>
