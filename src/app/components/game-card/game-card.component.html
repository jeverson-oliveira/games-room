<div class="game-card">
  <img [src]="game.thumbnail" [alt]="game.title" loading="lazy" width="365" height="160" />
  <h3>{{ game.title }}</h3>
  <p><strong>Gênero:</strong> {{ game.genre }}</p>
  <p><strong>Plataforma:</strong> {{ game.platform }}</p>
  <a [href]="game.game_url" target="_blank" rel="noopener">
    <button>Jogar agora</button>
  </a>
</div>
